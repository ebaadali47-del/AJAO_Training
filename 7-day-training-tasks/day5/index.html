<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Page</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="logo">ShopEase</div>
  <div class="cart-info">Cart: <span id="cartCount">0</span></div>
</header>

<div class="product-page">

  <div class="product-images">
    <img id="mainImage" src="https://placehold.co/400x400?text=Product" alt="Product image">
    <div class="thumbnail-row">
      <img src="https://placehold.co/80x80?text=1" class="thumb" data-full="https://placehold.co/400x400?text=Product">
      <img src="https://placehold.co/80x80?text=2" class="thumb" data-full="https://placehold.co/400x400?text=View+2">
      <img src="https://placehold.co/80x80?text=3" class="thumb" data-full="https://placehold.co/400x400?text=View+3">
    </div>
  </div>

  <div class="product-details">
    <h1>Wireless Headphones</h1>
    <p class="price">$49.99</p>
    <p class="description">
      Comfortable over-ear wireless headphones with long battery life
      and clear sound quality. Great for daily use, travel, and work.
    </p>

    <div class="quantity-row">
      <label for="qty">Quantity:</label>
      <input type="number" id="qty" value="1" min="1">
    </div>

    <button id="addToCartBtn" class="btn">Add to Cart</button>
    <p id="cartMsg" class="cart-msg"></p>
  </div>

</div>

<footer>
  <p>&copy; 2026 ShopEase</p>
</footer>

<script src="script.js"></script>
</body>
</html>
